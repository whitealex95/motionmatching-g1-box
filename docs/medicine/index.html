<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>G1 Motion Matching — medicine delivery demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8f877c;

       Everything below is shared with ../index.html -- the same motion database (../data/mm.*)

       kB of mesh + one texture rather than a second copy of the 35 MB database. -->
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/three.module.js",
      "three/addons/": "../vendor/addons/"
    }
  }
  </script>
  <script>
    window.DEMO_CONFIG = { data: '../data', box: 'boxmesh_medicine' };
  </script>

<body>
  <div id="hud">loading…</div>
